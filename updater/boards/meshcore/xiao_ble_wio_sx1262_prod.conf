# PRODUCTION-CANDIDATE profile (MC_PROFILE=prod). Not hardware-validated.
# Caps the compile-time log level at WARNING, which compiles every INFO/DEBUG log call out of the image, which is where the
# flash goes. State transitions and results remain available over MeshCore
# through the `log` command (the in-RAM event log is not a Zephyr log).
# USB CDC is deliberately kept: switching it off needs changes to upstream
# files (console choice, usb_dfu_touch.c) that are out of scope for this pass.
CONFIG_MC_LAB=n
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MAX_LEVEL=2
# The real-flash image states it explicitly; nothing relies on the default.
CONFIG_MC_DFU_DRY_RUN=n
