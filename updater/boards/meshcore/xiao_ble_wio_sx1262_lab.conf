# LAB profile: the first-hardware-session build. Applied after
# xiao_ble_wio_sx1262.conf (MC_PROFILE=lab, the default, in build-meshcore.sh).
#
# Keeps what is needed to see the thing work and to recover the board:
#   - USB CDC console (the XIAO's only tether) and the littlefs log backend
#   - MeshCore state transitions and command results (always on)
#   - Bluetooth host/connection warnings and errors
#   - MC_LAB: LoRa RX/TX frames, BLE scan rows, the RSSI-qualification line
#     every 2 s while arming, DFU status changes, reset cause
CONFIG_MC_LAB=y

# First-board bring-up: non-destructive by construction. START runs every gate
# and answers "DRY RUN PASS"; the DFU runner returns before it scans, connects,
# erases or writes. Stated explicitly so no profile relies on the default.
CONFIG_MC_DFU_DRY_RUN=y
# Keep the survey scan alive while idle (10-minute coexistence test).
CONFIG_MC_LAB_KEEP_SCANNING=y
