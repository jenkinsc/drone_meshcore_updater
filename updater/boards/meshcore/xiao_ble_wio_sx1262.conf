# Applied on top of prj.conf and boards/xiao_ble.conf by the MeshCore build
# (CMakeLists.txt adds it when MC_WIO_SX1262 is set; build-meshcore.sh sets it).
CONFIG_MC_CMD=y

# Flash headroom. With the MeshCore layer linked the image is within ~1% of the
# 388,970-byte slot0, so drop debug-only features that no DFU path depends on.
CONFIG_MCUMGR_GRP_OS_ECHO=n
CONFIG_BT_LOG_LEVEL_INF=n
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_BT_CONN_LOG_LEVEL_INF=n
CONFIG_BT_CONN_LOG_LEVEL_WRN=y

# Entropy: drop the CryptoCell (CC310) driver and use the nRF RNG peripheral
# directly with bias correction. The PSA CTR_DRBG then runs on the Oberon
# software driver. Frees ~8 KB; the identity seed and START tokens come from
# the same hardware RNG either way. MC build only: upstream is unchanged.
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y
CONFIG_ENTROPY_NRF5_BIAS_CORRECTION=y

# Host-stack extras this device does not use: verbose assert text, and GATT
# database-hash caching (we are a peripheral to a single web client).
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_READ_MULTIPLE=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
