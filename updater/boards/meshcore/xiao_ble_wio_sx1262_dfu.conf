# DFU profile (MC_PROFILE=dfu): the lab image with the dry run switched OFF.
# THIS FIRMWARE ERASES AND WRITES THE TARGET. Applied after _lab.conf.
# build-meshcore.sh / CMakeLists.txt refuse to build it unless
# MC_DISABLE_DRY_RUN=yes is set. Not hardware-validated.
CONFIG_MC_DFU_DRY_RUN=n
# Closer to production behaviour for the first real flash: no idle scanning.
CONFIG_MC_LAB_KEEP_SCANNING=n
